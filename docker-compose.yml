version: '3.8'

services:

  spring1:
    build: ./springboot-server
    container_name: spring1

  spring2:
    build: ./springboot-server
    container_name: spring2

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - spring1
      - spring2
